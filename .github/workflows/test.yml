name: CVS tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q


  windows-script-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $failures = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              foreach ($error in $errors) {
                $failures += "$($_.FullName):$($error.Extent.StartLineNumber): $($error.Message)"
              }
            }
          }
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Smoke test runtime discovery and doctor
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\discover_host_runtime.ps1
          .\scripts\environment_doctor.ps1
          .\scripts\init_runtime_registry.ps1 -Force
          .\scripts\environment_doctor.ps1

          $inventory = Get-Content .\data\host-runtime-inventory.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([int]$inventory.schema_version -ne 1) { throw 'unexpected host inventory schema' }

          $registry = Get-Content .\config\runtimes.local.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([int]$registry.schema_version -ne 1) { throw 'unexpected Runtime Registry schema' }

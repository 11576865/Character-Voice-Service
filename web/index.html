<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Character Voice Service Reader</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 860px; margin: 0 auto; padding: 24px; }
    textarea, select, input, button { font: inherit; }
    textarea { width: 100%; min-height: 320px; padding: 12px; box-sizing: border-box; line-height: 1.6; resize: vertical; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; }
    .settings, .controls { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
    .settings > div { min-width: 180px; }
    .settings label { margin-top: 0; }
    select, input { padding: 7px; }
    button { min-width: 96px; padding: 10px 18px; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.55; }
    #status { min-height: 1.5em; margin-top: 16px; white-space: pre-wrap; }
    #currentParagraph { margin-top: 12px; padding: 12px; border-left: 4px solid currentColor; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Character Voice Service Reader</h1>
  <p>输入文本，或导入 UTF-8 TXT / EPUB。阅读器按句子和长度切分，播放当前片段时预取下一片段。</p>

  <div class="settings">
    <div><label for="voice">角色</label><select id="voice" disabled></select></div>
    <div><label for="modelId">模型</label><select id="modelId" disabled></select></div>
    <div><label for="referenceId">参考语音</label><select id="referenceId" disabled></select></div>
    <div><label for="speed">速度</label><input id="speed" type="number" min="0.1" step="0.1" value="1.0"></div>
    <div><label for="txtFile">导入 TXT</label><input id="txtFile" type="file" accept=".txt,text/plain"></div>
    <div><label for="epubFile">导入 EPUB</label><input id="epubFile" type="file" accept=".epub,application/epub+zip"></div>
  </div>

  <label for="text">文本</label>
  <textarea id="text">The morning light reached the windows before the city began to stir.

She opened the book, found her place, and continued reading from the previous evening.</textarea>
  <p id="source">文本来源：手动输入</p>
  <div id="bookTitle">书名：手动输入</div>
  <div id="bookAuthor">作者：未提供</div>

  <div class="controls">
    <button id="start" disabled>开始</button>
    <button id="pause" disabled>暂停</button>
    <button id="stop" disabled>停止</button>
  </div>

  <audio id="audio" hidden></audio>
  <div id="status" role="status" aria-live="polite">正在读取角色列表……</div>
  <div id="currentChapter">当前章节：—</div>
  <div id="currentParagraph">当前段落：—</div>
  <script type="module" src="/reader-assets/js/reader.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Character Voice Service 测试</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 760px; margin: 0 auto; padding: 24px; }
    label { display: block; margin-top: 16px; margin-bottom: 6px; }
    textarea, select, input, button { font: inherit; }
    textarea { width: 100%; min-height: 150px; box-sizing: border-box; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    button { margin-top: 18px; padding: 10px 18px; cursor: pointer; }
    audio { width: 100%; margin-top: 18px; }
    #status { white-space: pre-wrap; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>Character Voice Service</h1>
  <p>此页面用于局域网和手机端测试。点击“生成并播放”后，浏览器会以用户交互触发音频播放。</p>

  <label for="voice">角色</label>
  <select id="voice">
    <option value="default">default</option>
  </select>

  <label for="text">文本</label>
  <textarea id="text">This is a test from my phone.</textarea>

  <div class="row">
    <div>
      <label for="speed">速度</label>
      <input id="speed" type="number" min="0.1" step="0.1" value="1.0">
    </div>
  </div>

  <button id="generate">生成并播放</button>
  <audio id="player" controls></audio>
  <div id="status">等待操作。</div>

<script>
const voiceSelect = document.getElementById("voice");
const textInput = document.getElementById("text");
const speedInput = document.getElementById("speed");
const generateButton = document.getElementById("generate");
const player = document.getElementById("player");
const statusBox = document.getElementById("status");

let currentObjectUrl = null;

async function loadVoices() {
  try {
    const response = await fetch("/v1/voices");
    const data = await response.json();
    if (!response.ok) throw new Error(JSON.stringify(data));

    voiceSelect.innerHTML = "";
    for (const voice of data.voices) {
      if (voice.error) continue;
      const option = document.createElement("option");
      option.value = voice.id;
      option.textContent = voice.name || voice.id;
      voiceSelect.appendChild(option);
    }

    if (!voiceSelect.options.length) {
      const option = document.createElement("option");
      option.value = "default";
      option.textContent = "default（未找到配置）";
      voiceSelect.appendChild(option);
    }
  } catch (error) {
    statusBox.textContent = "无法读取角色列表：" + error;
  }
}

generateButton.addEventListener("click", async () => {
  const text = textInput.value.trim();
  const speed = Number(speedInput.value);

  if (!text) {
    statusBox.textContent = "请输入文本。";
    return;
  }

  generateButton.disabled = true;
  statusBox.textContent = "正在生成……";

  try {
    const response = await fetch("/v1/audio/speech", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "gpt-sovits",
        voice: voiceSelect.value,
        input: text,
        response_format: "wav",
        speed
      })
    });

    if (!response.ok) {
      let detail = await response.text();
      throw new Error(detail || ("HTTP " + response.status));
    }

    const blob = await response.blob();

    if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
    currentObjectUrl = URL.createObjectURL(blob);
    player.src = currentObjectUrl;

    statusBox.textContent = "生成成功，正在播放。若浏览器阻止自动播放，请点击播放器的播放按钮。";

    try {
      await player.play();
    } catch (_) {
      statusBox.textContent = "生成成功。浏览器未允许自动播放，请点击播放器的播放按钮。";
    }
  } catch (error) {
    statusBox.textContent = "生成失败：\n" + error;
  } finally {
    generateButton.disabled = false;
  }
});

loadVoices();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Character Voice Service 连续阅读</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, sans-serif;
    }
    body {
      max-width: 860px;
      margin: 0 auto;
      padding: 24px;
    }
    textarea, select, input, button { font: inherit; }
    textarea {
      width: 100%;
      min-height: 320px;
      padding: 12px;
      box-sizing: border-box;
      line-height: 1.6;
      resize: vertical;
    }
    label {
      display: block;
      margin: 16px 0 6px;
      font-weight: 600;
    }
    .settings, .controls {
      display: flex;
      gap: 12px;
      align-items: end;
      flex-wrap: wrap;
    }
    .settings > div { min-width: 180px; }
    .settings label { margin-top: 0; }
    select, input { padding: 7px; }
    button {
      min-width: 96px;
      padding: 10px 18px;
      cursor: pointer;
    }
    button:disabled { cursor: not-allowed; opacity: 0.55; }
    audio { width: 100%; margin-top: 18px; }
    #status {
      min-height: 1.5em;
      margin-top: 16px;
      white-space: pre-wrap;
    }
    #currentParagraph {
      margin-top: 12px;
      padding: 12px;
      border-left: 4px solid currentColor;
      white-space: pre-wrap;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <h1>Character Voice Service</h1>
  <p>输入连续文本，并用一个或多个空行分隔段落。页面会按顺序逐段生成并播放。</p>

  <div class="settings">
    <div>
      <label for="voice">角色</label>
      <select id="voice" disabled></select>
    </div>
    <div>
      <label for="speed">速度</label>
      <input id="speed" type="number" min="0.1" step="0.1" value="1.0">
    </div>
  </div>

  <label for="text">文本（按空行切分段落）</label>
  <textarea id="text">The morning light reached the windows before the city began to stir.

She opened the book, found her place, and continued reading from the previous evening.

Each sentence arrived at an even pace, with enough time to hear every word clearly.</textarea>

  <div class="controls">
    <button id="start" disabled>开始</button>
    <button id="pause" disabled>暂停</button>
    <button id="stop" disabled>停止</button>
  </div>

  <audio id="player" controls></audio>
  <div id="status">正在读取角色列表……</div>
  <div id="currentParagraph" hidden></div>

<script>
const voiceSelect = document.getElementById("voice");
const textInput = document.getElementById("text");
const speedInput = document.getElementById("speed");
const startButton = document.getElementById("start");
const pauseButton = document.getElementById("pause");
const stopButton = document.getElementById("stop");
const player = document.getElementById("player");
const statusBox = document.getElementById("status");
const currentParagraphBox = document.getElementById("currentParagraph");

let state = "idle";
let paragraphs = [];
let currentIndex = 0;
let currentObjectUrl = null;
let activeRequest = null;
let sessionId = 0;

function splitParagraphs(text) {
  return text
    .split(/\r?\n\s*\r?\n/)
    .map(paragraph => paragraph.trim())
    .filter(Boolean);
}

function revokeCurrentAudio() {
  if (currentObjectUrl) {
    URL.revokeObjectURL(currentObjectUrl);
    currentObjectUrl = null;
  }
  player.removeAttribute("src");
  player.load();
}

function updateControls() {
  const hasVoice = Boolean(voiceSelect.value);
  const running = state === "loading" || state === "playing";
  const paused = state === "paused";
  startButton.disabled = !hasVoice || running;
  startButton.textContent = paused ? "继续" : "开始";
  pauseButton.disabled = state !== "playing";
  stopButton.disabled = state === "idle" || state === "completed";
  voiceSelect.disabled = running || paused || !hasVoice;
  textInput.disabled = running || paused;
  speedInput.disabled = running || paused;
}

function showNoVoices(message) {
  voiceSelect.innerHTML = "";
  const option = document.createElement("option");
  option.value = "";
  option.textContent = "未找到真实角色配置";
  voiceSelect.appendChild(option);
  statusBox.textContent = message;
  updateControls();
}

async function loadVoices() {
  try {
    const response = await fetch("/v1/voices");
    const data = await response.json();
    if (!response.ok) throw new Error(JSON.stringify(data));

    voiceSelect.innerHTML = "";
    for (const voice of data.voices) {
      if (voice.error) continue;
      const option = document.createElement("option");
      option.value = voice.id;
      option.textContent = voice.name || voice.id;
      voiceSelect.appendChild(option);
    }

    if (!voiceSelect.options.length) {
      showNoVoices("未找到真实角色配置。请先在 voices/ 中添加角色配置。");
      return;
    }

    statusBox.textContent = "已就绪。";
    updateControls();
  } catch (error) {
    showNoVoices("无法读取角色列表：" + error);
  }
}

function waitForPlayback(localSessionId) {
  return new Promise((resolve, reject) => {
    function cleanup() {
      player.removeEventListener("ended", onEnded);
      player.removeEventListener("error", onError);
    }
    function onEnded() {
      cleanup();
      resolve();
    }
    function onError() {
      cleanup();
      reject(new Error("浏览器无法播放返回的 WAV。"));
    }
    if (localSessionId !== sessionId) {
      resolve();
      return;
    }
    player.addEventListener("ended", onEnded, { once: true });
    player.addEventListener("error", onError, { once: true });
  });
}

async function readFromCurrentParagraph(localSessionId) {
  while (currentIndex < paragraphs.length && localSessionId === sessionId) {
    state = "loading";
    updateControls();
    const number = currentIndex + 1;
    const paragraph = paragraphs[currentIndex];
    currentParagraphBox.hidden = false;
    currentParagraphBox.textContent = paragraph;
    statusBox.textContent = `正在生成第 ${number}/${paragraphs.length} 段……`;

    activeRequest = new AbortController();
    let response;
    try {
      response = await fetch("/v1/audio/speech", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        signal: activeRequest.signal,
        body: JSON.stringify({
          voice: voiceSelect.value,
          input: paragraph,
          response_format: "wav",
          speed: Number(speedInput.value)
        })
      });
    } finally {
      activeRequest = null;
    }

    if (localSessionId !== sessionId) return;
    if (!response.ok) {
      throw new Error((await response.text()) || ("HTTP " + response.status));
    }

    const blob = await response.blob();
    revokeCurrentAudio();
    currentObjectUrl = URL.createObjectURL(blob);
    player.src = currentObjectUrl;
    state = "playing";
    statusBox.textContent = `正在播放第 ${number}/${paragraphs.length} 段。`;
    updateControls();

    await player.play();
    await waitForPlayback(localSessionId);
    if (localSessionId !== sessionId || state === "paused") return;
    currentIndex += 1;
  }

  if (localSessionId === sessionId && currentIndex >= paragraphs.length) {
    state = "completed";
    statusBox.textContent = `朗读完成，共 ${paragraphs.length} 段。`;
    updateControls();
  }
}

async function startOrResume() {
  if (state === "paused") {
    state = "playing";
    statusBox.textContent = `正在播放第 ${currentIndex + 1}/${paragraphs.length} 段。`;
    updateControls();
    try {
      await player.play();
    } catch (error) {
      state = "paused";
      statusBox.textContent = "无法继续播放：" + error;
      updateControls();
    }
    return;
  }

  const newParagraphs = splitParagraphs(textInput.value);
  const speed = Number(speedInput.value);
  if (!newParagraphs.length) {
    statusBox.textContent = "请输入至少一段文本。";
    return;
  }
  if (!Number.isFinite(speed) || speed <= 0) {
    statusBox.textContent = "速度必须大于 0。";
    return;
  }

  sessionId += 1;
  paragraphs = newParagraphs;
  currentIndex = 0;
  revokeCurrentAudio();
  const localSessionId = sessionId;

  try {
    await readFromCurrentParagraph(localSessionId);
  } catch (error) {
    if (error.name === "AbortError" || localSessionId !== sessionId) return;
    state = "idle";
    statusBox.textContent = `第 ${currentIndex + 1}/${paragraphs.length} 段失败：\n${error}`;
    updateControls();
  }
}

function pauseReading() {
  if (state === "playing") {
    player.pause();
    state = "paused";
    statusBox.textContent = `已暂停在第 ${currentIndex + 1}/${paragraphs.length} 段。`;
    updateControls();
  }
}

function stopReading() {
  sessionId += 1;
  if (activeRequest) {
    activeRequest.abort();
    activeRequest = null;
  }
  player.pause();
  revokeCurrentAudio();
  state = "idle";
  paragraphs = [];
  currentIndex = 0;
  currentParagraphBox.hidden = true;
  currentParagraphBox.textContent = "";
  statusBox.textContent = "已停止。";
  updateControls();
}

startButton.addEventListener("click", startOrResume);
pauseButton.addEventListener("click", pauseReading);
stopButton.addEventListener("click", stopReading);
loadVoices();
</script>
</body>
</html>
